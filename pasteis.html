<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio de Pastéis da Pastelaria Dolla — Pastéis tradicionais e especiais. Faça seu pedido pelo WhatsApp.">
    <title>Cardápio de Pastéis</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="cestapasteis.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="text-center">
            <a href="index.html" class="modern-btn inicio">🏠 Início</a>

        <h1>Pastel da Dolla</h1>

        <h1>Cardápio de Pastéis</h1>

        <div class="menu">
            <h2>Pastéis Tradicionais R$ 13,00</h2>
            <ul id="pasteis"></ul>
        </div>

        <div class="menu">
            <h2>Pastéis Especiais R$ 14,00</h2>
            <ul id="pasteisEsp"></ul>

        <div class="menu">
            <h2>Refrigerantes</h2>
            <ul id="refrigerantes"></ul>
        </div>

        <a id="whatsapp-link" href="#" class="order-button">
            <i class="fa-brands fa-whatsapp"></i> Faça seu pedido pelo WhatsApp
        </a>

        <footer>
            
            <center>
                <a href="index.html" class="modern-btn inicio">🏠 Início</a>
                <h2><img src="logo-pastel.png" alt=""></h2></center>


            <center>AGRADECEMOS SUA PREFERÊNCIA</center>
        </footer>

    <script src="menu-shared.js"></script>
    <script src="script.js"></script>

</html>
