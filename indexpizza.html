<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio de Pizzas da Pastelaria Dolla — Pizzas artesanais em vários tamanhos. Faça seu pedido pelo WhatsApp.">
    <title>Cardápio de Pizzas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="pizza.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="text-center">
            <a href="index.html" class="modern-btn inicio">🏠 Início</a>
        </div>

        <h1>Pizza da Dolla</h1>
        <img src="pizza.jpg" alt="Pizza" class="imagem-destaque" loading="lazy">

        <h1>Cardápio de Pizzas</h1>

        <div class="menu">
            <h2>Pizzas</h2>
            <ul id="pizzas-tradicionais"></ul>
        </div>

        <div class="menu tamanhos">
            <h2>Tamanhos</h2>
            <ul id="tamanhos-pizza"></ul>
            <h1>Adicional de Ingrediente R$2,50</h1>
        </div>

        <div class="menu">
            <h2>Refrigerantes</h2>
            <ul id="refrigerantes"></ul>
        </div>

        <a id="whatsapp-link" href="#" class="order-button">
            <i class="fa-brands fa-whatsapp"></i> Faça seu pedido pelo WhatsApp
        </a>

        <footer>
            <center>
                <a href="index.html" class="modern-btn inicio">🏠 Início</a>
                <h2><img src="logo-pastel.png" alt="Imagem de pizza"></h2>
                <p>AGRADECEMOS SUA PREFERÊNCIA</p>
            </center>
        </footer>
    </div>

    <script src="menu-shared.js"></script>
    <script src="jspizza.js"></script>
</body>
</html>
