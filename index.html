<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio digital do Pastel da Dolla — Pastéis, Pizzas e Esfirras. Faça seu pedido pelo WhatsApp.">
    <title>Escolha seu Cardápio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo-pastel.png" type="image/x-icon">
</head>
<body class="index-layout">
    <img src="logo-pastel.png" alt="Logo Pastel da Dolla" loading="lazy">
    <h1>Escolha seu cardápio</h1>

    <div class="menu-container">
        <div class="menu-option" onclick="window.location.href='pasteis.html'">
            <div class="menu-item">
                <img src="cestapasteis.jpg" alt="Pastéis" loading="lazy">
            </div>
            <p class="label">Pastéis</p>
        </div>

        <div class="menu-option" onclick="window.location.href='indexpizza.html'">
            <div class="menu-item">
                <img src="pizza.jpg" alt="Pizzas" loading="lazy">
            </div>
            <p class="label">Pizzas</p>
        </div>

        <div class="menu-option" onclick="window.location.href='esfirras.html'">
            <div class="menu-item">
                <img src="esfirra.jpg" alt="Esfirras" loading="lazy">
            </div>
            <p class="label">Esfirras</p>
        </div>
    </div>
</body>
</html>
